name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔮 Generate Prisma Client
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/pakevfinder"
        run: npx prisma generate || true

      - name: 🏗️ Build Next.js Production App
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/pakevfinder"
        run: npm run build

      - name: 🧹 Prune Dev Dependencies
        run: npm prune --omit=dev

      - name: 🗜️ Package into deploy.zip
        run: |
          mkdir -p upload_stage
          cp -r .next upload_stage/
          cp -r public upload_stage/
          cp -r node_modules upload_stage/
          cp package.json upload_stage/
          cp next.config.* upload_stage/ || true
          cp server.js upload_stage/ || true
          cp -r lib upload_stage/ || true
          cp -r types upload_stage/ || true
          cp -r prisma upload_stage/ || true
          
          mkdir -p release_dist
          cd upload_stage
          zip -r ../release_dist/deploy.zip .
          cd ..

      - name: 🚀 Upload deploy.zip via SSH/SCP
        env:
          SSH_HOST: ${{ secrets.FTP_HOST || secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          
          SSH_HOST=$(echo "$SSH_HOST" | tr -d '\r\n ')
          SSH_USER=$(echo "$SSH_USER" | tr -d '\r\n ')
          SSH_PASS=$(echo "$SSH_PASS" | tr -d '\r\n')

          echo "Initiating secure SCP transfer..."
          sshpass -p "$SSH_PASS" scp -P 22 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            -o IPQoS=throughput \
            release_dist/deploy.zip "$SSH_USER@$SSH_HOST:/repositories/usaidahmed/deploy.zip"
          
          echo "Upload complete!"
