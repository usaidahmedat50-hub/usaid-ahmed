name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔮 Generate Prisma Client
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/pakevfinder"
        run: npx prisma generate || true

      - name: 🏗️ Build Next.js Production App
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/pakevfinder"
        run: npm run build

      - name: 🧹 Prune Dev Dependencies
        run: npm prune --omit=dev

      - name: 🗜️ Package into deploy.zip
        run: |
          mkdir -p upload_stage
          cp -r .next upload_stage/
          cp -r public upload_stage/
          cp -r node_modules upload_stage/
          cp package.json upload_stage/
          cp next.config.* upload_stage/ || true
          cp server.js upload_stage/ || true
          cp -r lib upload_stage/ || true
          cp -r types upload_stage/ || true
          cp -r prisma upload_stage/ || true
          
          mkdir -p release_dist
          cd upload_stage
          zip -r ../release_dist/deploy.zip .
          cd ..

      - name: 🚀 Upload deploy.zip via Python FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c '
          import os, ftplib, sys

          host = os.environ.get("FTP_HOST")
          user = os.environ.get("FTP_USER")
          password = os.environ.get("FTP_PASS")
          target_dir = "/repositories/usaidahmed"
          file_path = "release_dist/deploy.zip"

          print(f"Connecting to FTP host {host}...")
          ftp = ftplib.FTP(timeout=120)
          ftp.connect(host, 21)
          ftp.login(user, password)
          ftp.set_pasv(True)

          print(f"Navigating to {target_dir}...")
          ftp.cwd(target_dir)

          print("Uploading deploy.zip...")
          with open(file_path, "rb") as f:
              ftp.storbinary("STOR deploy.zip", f, blocksize=1024*1024)

          print("Upload complete!")
          ftp.quit()
          '
