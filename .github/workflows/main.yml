name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js
        run: npm run build

      - name: Prepare Single Deployment Zip
        run: |
          mkdir -p upload_stage
          cp -r .next upload_stage/
          cp -r public upload_stage/
          cp package.json upload_stage/
          cp next.config.* upload_stage/ || true
          cp server.js upload_stage/ || true
          cd upload_stage
          zip -r ../deploy.zip .
          cd ..
          mkdir -p deploy_out
          mv deploy.zip deploy_out/

      - name: Sync Deploy Zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: repositories/usaidahmed/
          local-dir: ./deploy_out/
          dangerous-clean-slate: false
