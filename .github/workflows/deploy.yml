name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Next.js Production App
        run: npm run build

      - name: 🧹 Prune Dev Dependencies
        run: npm prune --omit=dev

      - name: 🗜️ Package Build Artifacts into deploy.zip
        run: |
          mkdir -p upload_stage
          cp -r .next upload_stage/
          cp -r public upload_stage/
          cp -r node_modules upload_stage/
          cp package.json upload_stage/
          cp next.config.* upload_stage/ || true
          cp server.js upload_stage/ || true
          cp -r lib upload_stage/ || true
          cp -r types upload_stage/ || true
          cd upload_stage
          zip -r ../deploy.zip .
          cd ..

      - name: 🚀 Sync Deploy Zip via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_HOST || secrets.FTP_SERVER }}
          ssh_private_key: ''
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './deploy.zip'
          remote_path: '/home/pakevfin/repositories/usaidahmed/'
          sftp_only: true
