name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔮 Generate Prisma Client
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/pakevfinder"
        run: npx prisma generate || true

      - name: 🏗️ Build Next.js Application
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/pakevfinder"
        run: npm run build

      - name: 🧹 Prune Dev Dependencies
        run: npm prune --omit=dev

      - name: 🗜️ Package into deploy.zip
        run: |
          mkdir -p release
          zip -r release/deploy.zip .next public package.json server.js node_modules lib types prisma next.config.js -x "*.git*" "*.github*"

      - name: 🚀 Upload Single Zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./release/
          server-dir: /repositories/usaidahmed/
          dangerous-clean-slate: false
